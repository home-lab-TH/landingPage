name: preview
# Builds the redesign branch and stores dist/ on the preview-dist branch so it can be reviewed offline.
on:
  push:
    branches: [redesign]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: |
          cd dist
          git init -q -b preview-dist
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "preview ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" preview-dist
